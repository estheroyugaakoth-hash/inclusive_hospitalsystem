<script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;

        // Get registered patients from browser storage
        const patients = JSON.parse(
            localStorage.getItem("patients") || "[]"
        );

        // Find the patient with matching login details
        const patient = patients.find(function(p) {
            return p.email.toLowerCase() === email &&
                   p.password === password;
        });

        if (patient) {
            // Save the logged-in patient's details
            localStorage.setItem("loggedInPatient", JSON.stringify({
                name: patient.name,
                email: patient.email
            }));

            // Open the patient dashboard
            window.location.href = "patient-dashboard.html";
        } else {
            alert("Invalid email or password. Please check your details or register first.");
        }
    });
</script>
