<form id="registrationForm">

    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName"
           placeholder="Enter your full name"
           autocomplete="name" required>

    <label for="email">Email Address</label>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob"
           autocomplete="bday" required>

    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
        <option value="">Select an option</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
        <option value="prefer-not-to-say">Prefer not to say</option>
    </select>

    <label for="password">Create Password</label>
    <input type="password" id="password" name="password"
           placeholder="Create a password"
           autocomplete="new-password" required>

    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword"
           name="confirmPassword"
           placeholder="Enter your password again"
           autocomplete="new-password" required>

    <button type="submit">Create Account</button>

</form>

<script>
    const registrationForm =
        document.getElementById("registrationForm");

    registrationForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const phone = document.getElementById("phone").value.trim();
        const dob = document.getElementById("dob").value;
        const gender = document.getElementById("gender").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Passwords do not match. Please try again.");
            document.getElementById("confirmPassword").focus();
            return;
        }

        let patients = [];

        try {
            patients = JSON.parse(
                localStorage.getItem("patients") || "[]"
            );

            if (!Array.isArray(patients)) {
                throw new Error("Invalid patient data");
            }
        } catch (error) {
            alert("Patient storage could not be read. Please check your browser storage.");
            return;
        }

        const existingPatient = patients.some(function(patient) {
            return patient.email &&
                   patient.email.toLowerCase() === email;
        });

        if (existingPatient) {
            alert("An account with this email already exists. Please log in.");
            return;
        }

        patients.push({
            name: name,
            email: email,
            phone: phone,
            dob: dob,
            gender: gender,
            password: password
        });

        try {
            localStorage.setItem("patients", JSON.stringify(patients));
            alert("Registration successful! You can now log in.");
            window.location.href = "login.html";
        } catch (error) {
            alert("Registration could not be saved. Check your browser storage.");
        }
    });
</script>
